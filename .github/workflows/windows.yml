name: windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: msys2/mingw64 on windows-${{ matrix.windows }}
    runs-on: windows-${{ matrix.windows }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        windows: ['2025']

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm-tools
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-uchardet
            mingw-w64-x86_64-libpsl
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libavif
            mingw-w64-x86_64-SDL2

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}\ccache
            ${{ runner.temp }}\thinlto-cache
          key: ccache-windows-${{ matrix.windows }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.windows }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache --max-size=500M
          ccache --zero-stats

      - name: Show toolchain versions
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -2
          ccache --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl

      - name: Build (ThinLTO via LLD)
        if: hashFiles('meson.build') != ''
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CC_LD=lld
          export CXX_LD=lld
          meson setup builddir --werror -Db_lto=true -Db_lto_mode=thin
          THINLTO_CACHE_DIR=$(cygpath -m "$RUNNER_TEMP/thinlto-cache")
          mkdir -p "$THINLTO_CACHE_DIR"
          meson configure builddir -Dc_link_args="-Wl,--thinlto-cache-dir=$THINLTO_CACHE_DIR -Wl,--thinlto-cache-policy=cache_size_bytes=300m"
          meson compile -C builddir

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}\ccache
            ${{ runner.temp }}\thinlto-cache
          key: ccache-windows-${{ matrix.windows }}-${{ github.sha }}
