<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Royal blue ribbon gradient -->
    <linearGradient id="bm-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#556edb"/>
      <stop offset="35%" stop-color="#3b52c0"/>
      <stop offset="75%" stop-color="#283d9e"/>
      <stop offset="100%" stop-color="#18276f"/>
    </linearGradient>
    <!-- Gold trim gradient -->
    <linearGradient id="bm-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe682"/>
      <stop offset="50%" stop-color="#e2b236"/>
      <stop offset="100%" stop-color="#9a6e14"/>
    </linearGradient>
  </defs>

  <!-- Drop Shadow -->
  <polygon points="6,3 18,3 18,21 12,16.5 6,21" fill="#000000" opacity="0.22" transform="translate(1, 1)"/>

  <!-- Outer Ribbon Border -->
  <polygon points="5.5,2.5 18.5,2.5 18.5,21.5 12,16.8 5.5,21.5"
           fill="#0f1947" stroke="#0a1030" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Blue Ribbon Body -->
  <polygon points="6,3 18,3 18,20.8 12,16.4 6,20.8" fill="url(#bm-ribbon)"/>

  <!-- Gold Top Trim -->
  <rect x="6" y="3" width="12" height="2" fill="url(#bm-gold)"/>

  <!-- Left Highlight Stripe on Silk Ribbon -->
  <line x1="7" y1="5.2" x2="7" y2="19.5" stroke="#889df5" stroke-width="0.6" stroke-linecap="round" opacity="0.75"/>

  <!-- Elegant Star Outline in ribbon center -->
  <polygon points="12,7.5 13.3,10.2 16.2,10.5 14.1,12.5 14.7,15.4 12,13.9 9.3,15.4 9.9,12.5 7.8,10.5 10.7,10.2"
           fill="none" stroke="url(#bm-gold)" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
