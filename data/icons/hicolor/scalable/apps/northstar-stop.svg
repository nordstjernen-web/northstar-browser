<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Metallic housing gradient -->
    <linearGradient id="stop-housing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ab0c8"/>
      <stop offset="25%" stop-color="#cedae8"/>
      <stop offset="60%" stop-color="#7c92aa"/>
      <stop offset="100%" stop-color="#46586e"/>
    </linearGradient>
    <!-- Side visor / hood gradient -->
    <linearGradient id="stop-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b2c4dc"/>
      <stop offset="100%" stop-color="#3b4d63"/>
    </linearGradient>
    <!-- Glowing red lens gradient -->
    <radialGradient id="stop-red" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ff9eb0"/>
      <stop offset="45%" stop-color="#ff1224"/>
      <stop offset="80%" stop-color="#bd0412"/>
      <stop offset="100%" stop-color="#550008"/>
    </radialGradient>
    <!-- Red lens outer glow -->
    <radialGradient id="stop-redglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <!-- Dark unlit amber lens -->
    <radialGradient id="stop-amber" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#806230"/>
      <stop offset="45%" stop-color="#422f12"/>
      <stop offset="100%" stop-color="#1c1305"/>
    </radialGradient>
    <!-- Dark unlit green lens -->
    <radialGradient id="stop-green" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#3d6c48"/>
      <stop offset="45%" stop-color="#173e20"/>
      <stop offset="100%" stop-color="#081e0e"/>
    </radialGradient>
  </defs>

  <!-- Drop Shadow -->
  <rect x="7.5" y="3.5" width="10" height="18.5" rx="1.5" fill="#000000" opacity="0.25"/>

  <!-- Left Visor Hoods (3 steps) -->
  <path d="M 7 5.5 L 5.2 6.2 L 5.2 7.8 L 7 8.2 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>
  <path d="M 7 11.0 L 5.2 11.7 L 5.2 13.3 L 7 13.7 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>
  <path d="M 7 16.5 L 5.2 17.2 L 5.2 18.8 L 7 19.2 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>

  <!-- Right Visor Hoods (3 steps) -->
  <path d="M 17 5.5 L 18.8 6.2 L 18.8 7.8 L 17 8.2 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>
  <path d="M 17 11.0 L 18.8 11.7 L 18.8 13.3 L 17 13.7 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>
  <path d="M 17 16.5 L 18.8 17.2 L 18.8 18.8 L 17 19.2 Z" fill="url(#stop-visor)" stroke="#223042" stroke-width="0.4"/>

  <!-- Main Metallic Housing Box -->
  <rect x="6.8" y="2.5" width="10.4" height="19" rx="1.2"
        fill="url(#stop-housing)" stroke="#1a2736" stroke-width="0.6"/>

  <!-- Housing Highlight Edge -->
  <line x1="7.4" y1="3" x2="7.4" y2="21" stroke="#ffffff" stroke-width="0.5" opacity="0.85"/>

  <!-- Top Hood over Red Lamp -->
  <path d="M 8.5 5 C 8.5 4, 15.5 4, 15.5 5" fill="none" stroke="#223042" stroke-width="0.8"/>

  <!-- Glow around active Red Lamp -->
  <circle cx="12" cy="6.8" r="4.2" fill="url(#stop-redglow)"/>

  <!-- RED STOP LAMP (Active Glowing) -->
  <circle cx="12" cy="6.8" r="2.8" fill="url(#stop-red)" stroke="#3a0006" stroke-width="0.4"/>

  <!-- Red Specular Highlight Sparkle -->
  <ellipse cx="11.2" cy="5.8" rx="0.8" ry="0.5" fill="#ffffff" opacity="0.92"/>

  <!-- AMBER LAMP (Dark / Unlit) -->
  <circle cx="12" cy="12.2" r="2.4" fill="url(#stop-amber)" stroke="#1a1204" stroke-width="0.4"/>
  <ellipse cx="11.4" cy="11.4" rx="0.6" ry="0.35" fill="#ffffff" opacity="0.25"/>

  <!-- GREEN LAMP (Dark / Unlit) -->
  <circle cx="12" cy="17.4" r="2.4" fill="url(#stop-green)" stroke="#061408" stroke-width="0.4"/>
  <ellipse cx="11.4" cy="16.6" rx="0.6" ry="0.35" fill="#ffffff" opacity="0.25"/>
</svg>
