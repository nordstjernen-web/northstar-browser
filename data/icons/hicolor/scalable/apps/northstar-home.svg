<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Purple/Indigo Roof gradient -->
    <linearGradient id="home-roof" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6976d8"/>
      <stop offset="45%" stop-color="#4752b5"/>
      <stop offset="100%" stop-color="#2a3286"/>
    </linearGradient>
    <!-- Cottage wall gradient -->
    <linearGradient id="home-wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#edf0fc"/>
      <stop offset="100%" stop-color="#c5cce6"/>
    </linearGradient>
    <!-- Chimney gradient -->
    <linearGradient id="home-chimney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d467c"/>
      <stop offset="100%" stop-color="#1c2044"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="12" cy="21.2" rx="9.2" ry="1.8" fill="#000000" opacity="0.22"/>

  <!-- Chimney on right roof slope -->
  <rect x="15.8" y="4.5" width="2.6" height="5.5" fill="url(#home-chimney)" stroke="#11142e" stroke-width="0.5"/>
  <line x1="15.5" y1="4.5" x2="18.8" y2="4.5" stroke="#7c8ad8" stroke-width="0.75"/>

  <!-- Cottage Body / Walls -->
  <rect x="5.2" y="11.5" width="13.6" height="8.8" rx="0.5"
        fill="url(#home-wall)" stroke="#1e2348" stroke-width="0.6"/>

  <!-- Wall Clapboard Horizontal Lines -->
  <line x1="5.6" y1="14" x2="18.4" y2="14" stroke="#d5dcf2" stroke-width="0.5"/>
  <line x1="5.6" y1="16.5" x2="18.4" y2="16.5" stroke="#d5dcf2" stroke-width="0.5"/>
  <line x1="5.6" y1="19" x2="18.4" y2="19" stroke="#d5dcf2" stroke-width="0.5"/>

  <!-- Arched Indigo Doorway -->
  <path d="M 10.4 20.3 L 10.4 15.5 C 10.4 14.2, 13.6 14.2, 13.6 15.5 L 13.6 20.3 Z"
        fill="#262d66" stroke="#12163a" stroke-width="0.5"/>
  <!-- Brass Doorknob -->
  <circle cx="12.8" cy="17.8" r="0.45" fill="#f0ca50"/>

  <!-- Window next to door -->
  <rect x="6.8" y="13.8" width="2.4" height="2.8" rx="0.3" fill="#6878be" stroke="#22274e" stroke-width="0.4"/>
  <line x1="8" y1="13.8" x2="8" y2="16.6" stroke="#edf0fc" stroke-width="0.3"/>
  <line x1="6.8" y1="15.2" x2="9.2" y2="15.2" stroke="#edf0fc" stroke-width="0.3"/>

  <!-- Pitched Roof (Gable Triangle) -->
  <polygon points="12,3.2 21.6,12.2 19.8,12.6 12,5.2 4.2,12.6 2.4,12.2"
        fill="#1e2348"/>
  <polygon points="12,3.5 21.0,12.0 3.0,12.0"
        fill="url(#home-roof)" stroke="#1c2048" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Roof Crest & Eaves Specular Highlights -->
  <line x1="12" y1="3.8" x2="3.8" y2="11.6" stroke="#9bb1f5" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="12" y1="3.8" x2="20.2" y2="11.6" stroke="#7284dc" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Cute Green Grass Tufts at cottage base -->
  <!-- Left grass -->
  <path d="M 3.6 20.8 L 4.4 18.8 L 5.2 20.8 M 4.8 20.8 L 5.8 18.2 L 6.8 20.8"
        stroke="#2eb83c" stroke-width="0.75" stroke-linecap="round"/>
  <!-- Right grass -->
  <path d="M 17.2 20.8 L 18.0 18.2 L 18.8 20.8 M 18.5 20.8 L 19.5 18.8 L 20.4 20.8"
        stroke="#2eb83c" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="3" y1="20.8" x2="21" y2="20.8" stroke="#1e7828" stroke-width="0.6"/>
</svg>
